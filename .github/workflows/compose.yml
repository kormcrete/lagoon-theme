name: compose

on:
  push:
    branches: ['**']
    paths: ['compose/**', 'tokens/**', '.github/workflows/compose.yml']
  pull_request:
    paths: ['compose/**', 'tokens/**', '.github/workflows/compose.yml']
  workflow_dispatch:

permissions:
  contents: read

# lagoon-compose: Android and JVM on Linux, iOS on macOS.
jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android + JVM
            os: ubuntu-latest
            tasks: ':lagoon-compose:assemble :lagoon-compose:jvmTest'
          - name: iOS
            os: macos-latest
            tasks: ':lagoon-compose:compileKotlinIosSimulatorArm64 :lagoon-compose:compileKotlinIosArm64'
    defaults:
      run:
        shell: bash
        working-directory: compose
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          set -o pipefail
          ./gradlew ${{ matrix.tasks }} --console=plain --stacktrace 2>&1 | tee build.log
      - name: Report build errors
        if: failure()
        run: |
          # Compiler and Gradle errors as one annotation, readable without downloading the log.
          errors=$(grep -E '^e: |^\* What went wrong|^> |error:|Could not|Unresolved' build.log | grep -v '^> Task' | head -80 \
            | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Build errors::${errors:-no error lines found}"
