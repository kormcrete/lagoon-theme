# FlatLagoonModernLaf: the modern Lagoon, loaded for the class of the same name.
# Key reference: https://www.formdev.com/flatlaf/properties-files/
#
# Every colour, radius and size here is a token of lagoon.tokens.json (the file the Compose theme is generated
# from too), which FlatLagoonModernLaf turns into UI defaults applied after this file:
#   Lagoon.color.<name>       the tokens' colours: ground, surface, ink, line, primary, success, attention, danger...
#   Lagoon.tile.<i>.background / .foreground, Lagoon.tileCount     avatar and category tiles
#   Lagoon.radius.<name>      corner radii (small, control, card, dialog)
#   Lagoon.arc.<name>         the same as FlatLaf arcs, twice the radius
#   Lagoon.metrics.<name>     desktop lengths: controlHeight, buttonHeight, rowHeight, touchTarget, gutter, gap
#   Lagoon.textSize.<name>    desktop text sizes: title, headline, body, small, label
#   Lagoon.titleFont, headlineFont, headingFont, smallFont, smallStrongFont, labelFont
#                             text styles, each a step from the body size (the platform's UI font size)
#   Lagoon.gapInsets, Lagoon.gutterInsets, Lagoon.cardBorder
# An application re-tints through the keys below (in its own FlatLagoonModernLaf.properties, registered with
# FlatLaf.registerCustomDefaultsSource), not through the Lagoon.color.* tokens.

#---- base variables -----------------------------------------------------------
@background = $Lagoon.color.ground
@foreground = $Lagoon.color.ink
@componentBackground = $Lagoon.color.surface
@buttonBackground = $Lagoon.color.surface
@menuBackground = $Lagoon.color.surface
@disabledForeground = $Lagoon.color.inkFaint
# One accent: FlatLaf derives selections, focus, checkmarks, sliders, progress and tab underlines from it.
@accentColor = $Lagoon.color.primary
@selectionInactiveBackground = $Lagoon.color.selection
@selectionInactiveForeground = $Lagoon.color.ink
@componentMargin = 2,12,2,12

#---- tones: a tint and its ink, for pills and other status marks -------------------
Lagoon.tone.info.background = $Lagoon.color.primaryTint
Lagoon.tone.info.foreground = $Lagoon.color.primaryStrong
Lagoon.tone.success.background = $Lagoon.color.successTint
Lagoon.tone.success.foreground = $Lagoon.color.success
Lagoon.tone.attention.background = $Lagoon.color.attentionTint
Lagoon.tone.attention.foreground = $Lagoon.color.attention
Lagoon.tone.danger.background = $Lagoon.color.dangerTint
Lagoon.tone.danger.foreground = $Lagoon.color.danger
Lagoon.tone.neutral.background = $Lagoon.color.neutralTint
Lagoon.tone.neutral.foreground = $Lagoon.color.neutral

#---- shapes and frames ----------------------------------------------------------
Component.arc = $Lagoon.arc.control
TextComponent.arc = $Lagoon.arc.control
Button.arc = $Lagoon.arc.control
ProgressBar.arc = 999
Popup.borderCornerRadius = $Lagoon.radius.small
Component.borderColor = $Lagoon.color.line
Component.disabledBorderColor = $Lagoon.color.lineSoft
Component.focusColor = $Lagoon.color.primaryTint
Component.focusedBorderColor = $Lagoon.color.primary
Component.innerFocusWidth = 1
Component.linkColor = $Lagoon.color.primary
Component.error.borderColor = $Lagoon.color.danger
Component.error.focusedBorderColor = $Lagoon.color.danger
Component.warning.borderColor = $Lagoon.color.attention
Component.warning.focusedBorderColor = $Lagoon.color.attention
Component.success.borderColor = $Lagoon.color.success
Component.success.focusedBorderColor = $Lagoon.color.success
Separator.foreground = $Lagoon.color.line
PopupMenu.borderColor = $Lagoon.color.line

#---- heights (ModernControlUI): one for every control, one for every row --------------
Button.minimumHeight = $Lagoon.metrics.controlHeight
ToggleButton.minimumHeight = $Lagoon.metrics.controlHeight
TextField.minimumHeight = $Lagoon.metrics.controlHeight
PasswordField.minimumHeight = $Lagoon.metrics.controlHeight
FormattedTextField.minimumHeight = $Lagoon.metrics.controlHeight
ComboBox.minimumHeight = $Lagoon.metrics.controlHeight
Spinner.minimumHeight = $Lagoon.metrics.controlHeight
TabbedPane.tabHeight = $Lagoon.metrics.controlHeight
TableHeader.height = $Lagoon.metrics.controlHeight
Table.rowHeight = $Lagoon.metrics.rowHeight
Tree.rowHeight = $Lagoon.metrics.rowHeight
# ModernControlUI.List: the least height of a list row (a taller renderer keeps its own).
List.rowHeight = $Lagoon.metrics.rowHeight

#---- buttons: white with a hairline; the default button is the primary one ---------
Button.margin = 2,16,2,16
Button.background = $Lagoon.color.surface
Button.foreground = $Lagoon.color.ink
Button.borderColor = $Lagoon.color.line
Button.hoverBorderColor = $Lagoon.color.line
Button.hoverBackground = $Lagoon.color.surfaceMuted
Button.pressedBackground = $Lagoon.color.track
Button.focusedBackground = $Lagoon.color.surface
Button.focusedBorderColor = $Lagoon.color.primary
Button.toolbar.hoverBackground = $Lagoon.color.track
Button.toolbar.pressedBackground = darken($Lagoon.color.track,6%)
ToggleButton.selectedBackground = $Lagoon.color.primaryTint
ToggleButton.selectedForeground = $Lagoon.color.primaryStrong
ToggleButton.toolbar.selectedBackground = $Lagoon.color.primaryTint
Button.default.background = $Lagoon.color.primary
Button.default.foreground = $Lagoon.color.onPrimary
Button.default.borderColor = $Lagoon.color.primary
Button.default.borderWidth = 1
Button.default.hoverBackground = $Lagoon.color.primaryStrong
Button.default.hoverBorderColor = $Lagoon.color.primaryStrong
Button.default.pressedBackground = darken($Lagoon.color.primaryStrong,6%)
Button.default.focusedBackground = $Lagoon.color.primary
Button.default.focusedBorderColor = $Lagoon.color.primaryStrong
Button.default.boldText = true
# Tonal: the accent's tint under its strong ink.
Lagoon.tonal.background = $Lagoon.color.primaryTint
Lagoon.tonal.foreground = $Lagoon.color.primaryStrong
Lagoon.tonal.hoverBackground = darken($Lagoon.color.primaryTint,4%)
Lagoon.tonal.pressedBackground = darken($Lagoon.color.primaryTint,8%)
# Danger: white, red ink, a red hairline; red tint on hover.
Lagoon.danger.background = $Lagoon.color.surface
Lagoon.danger.foreground = $Lagoon.color.danger
Lagoon.danger.borderColor = $Lagoon.color.dangerLine
Lagoon.danger.hoverBackground = $Lagoon.color.dangerTint
Lagoon.danger.pressedBackground = darken($Lagoon.color.dangerTint,5%)

#---- tables, tabs, tooltips, progress ------------------------------------------------
Table.showHorizontalLines = true
Table.intercellSpacing = 0,1
Table.gridColor = $Lagoon.color.divider
TableHeader.background = $Lagoon.color.surface
TableHeader.foreground = $Lagoon.color.inkMuted
TableHeader.separatorColor = $Lagoon.color.divider
TableHeader.bottomSeparatorColor = $Lagoon.color.line
TabbedPane.foreground = $Lagoon.color.inkMuted
TabbedPane.selectedForeground = $Lagoon.color.ink
ToolTip.background = $Lagoon.color.night
ToolTip.foreground = $Lagoon.color.onNight
ToolTip.border = 6,10,6,10,$Lagoon.color.night
ProgressBar.background = $Lagoon.color.track
ProgressBar.foreground = $Lagoon.color.primary

#---- text styles (FlatLaf's h1..h3 and small style classes take the tokens' sizes) -------
h1.font = $Lagoon.titleFont
h2.font = $Lagoon.headlineFont
h3.font = $Lagoon.headingFont
small.font = $Lagoon.smallFont

#---- style classes (FlatClientProperties.STYLE_CLASS) -------------------------------
[style].caption = font: $Lagoon.labelFont
[style].muted = foreground: $Lagoon.color.inkMuted

# A white card with soft corners and a hairline (LagoonCard adds a soft shadow instead).
[style]Panel.card = arc: $Lagoon.arc.card; background: $Lagoon.color.surface; border: $Lagoon.cardBorder

[style]Button.primary = \
	background: $Button.default.background; \
	foreground: $Button.default.foreground; \
	borderColor: $Button.default.borderColor; \
	hoverBackground: $Button.default.hoverBackground; \
	hoverBorderColor: $Button.default.hoverBorderColor; \
	pressedBackground: $Button.default.pressedBackground; \
	focusedBackground: $Button.default.focusedBackground; \
	focusedBorderColor: $Button.default.focusedBorderColor; \
	font: $Lagoon.headingFont
[style]Button.tonal = \
	background: $Lagoon.tonal.background; \
	foreground: $Lagoon.tonal.foreground; \
	borderColor: $Lagoon.tonal.background; \
	hoverBackground: $Lagoon.tonal.hoverBackground; \
	hoverBorderColor: $Lagoon.tonal.hoverBackground; \
	pressedBackground: $Lagoon.tonal.pressedBackground; \
	focusedBackground: $Lagoon.tonal.background; \
	font: $Lagoon.headingFont
[style]Button.danger = \
	background: $Lagoon.danger.background; \
	foreground: $Lagoon.danger.foreground; \
	borderColor: $Lagoon.danger.borderColor; \
	hoverBackground: $Lagoon.danger.hoverBackground; \
	hoverBorderColor: $Lagoon.danger.borderColor; \
	pressedBackground: $Lagoon.danger.pressedBackground; \
	focusedBackground: $Lagoon.danger.background; \
	focusedBorderColor: $Lagoon.danger.foreground; \
	font: $Lagoon.headingFont

# Status pills on labels (StatusPill adds the dot): one per tone.
[style]Label.pill-info = arc: 999; border: 3,7,3,8; iconTextGap: 5; font: $Lagoon.labelFont; \
	background: $Lagoon.tone.info.background; foreground: $Lagoon.tone.info.foreground
[style]Label.pill-success = arc: 999; border: 3,7,3,8; iconTextGap: 5; font: $Lagoon.labelFont; \
	background: $Lagoon.tone.success.background; foreground: $Lagoon.tone.success.foreground
[style]Label.pill-attention = arc: 999; border: 3,7,3,8; iconTextGap: 5; font: $Lagoon.labelFont; \
	background: $Lagoon.tone.attention.background; foreground: $Lagoon.tone.attention.foreground
[style]Label.pill-danger = arc: 999; border: 3,7,3,8; iconTextGap: 5; font: $Lagoon.labelFont; \
	background: $Lagoon.tone.danger.background; foreground: $Lagoon.tone.danger.foreground
[style]Label.pill-neutral = arc: 999; border: 3,7,3,8; iconTextGap: 5; font: $Lagoon.labelFont; \
	background: $Lagoon.tone.neutral.background; foreground: $Lagoon.tone.neutral.foreground

# Segmented: a rounded track (a panel) holding toggle buttons; the selected one is white (SegmentedControl).
[style]Panel.segmented = arc: $Lagoon.arc.control; background: $Lagoon.color.track; border: 4,4,4,4
[style]ToggleButton.segmented = \
	arc: $Lagoon.arc.small; \
	borderWidth: 0; \
	minimumWidth: 0; \
	background: $Lagoon.color.track; \
	foreground: $Lagoon.color.inkMuted; \
	hoverBackground: darken($Lagoon.color.track,3%); \
	pressedBackground: darken($Lagoon.color.track,6%); \
	focusedBackground: $Lagoon.color.track; \
	selectedBackground: $Lagoon.color.surface; \
	selectedForeground: $Lagoon.color.ink

# A search field: magnifier in front, a clear button, the soft line.
[style]TextField.search = \
	leadingIcon: com.formdev.flatlaf.icons.FlatSearchIcon; \
	showClearButton: true; \
	iconTextGap: 8; \
	borderColor: $Lagoon.color.lineSoft; \
	placeholderForeground: $Lagoon.color.inkMuted

#---- Lagoon components ------------------------------------------------------------
LagoonCard.background = $Lagoon.color.surface
LagoonCard.arc = $Lagoon.arc.card
LagoonCard.padding = $Lagoon.gapInsets
# The shadow: its colour where it meets the card, fading out over shadowWidth pixels, shadowOffset lower.
LagoonCard.shadowColor = fade($Lagoon.color.shadow,12%)
LagoonCard.shadowWidth = 8
LagoonCard.shadowOffset = 2
StatusPill.dotWidth = 6
AvatarTile.arc = $Lagoon.arc.control
AvatarTile.font = $Lagoon.labelFont
Stepper.background = $Lagoon.color.surfaceMuted
Stepper.foreground = $Lagoon.color.ink
Stepper.filledBackground = $Lagoon.color.primary
Stepper.filledForeground = $Lagoon.color.onPrimary
Stepper.minimumHeight = $Lagoon.metrics.touchTarget
Stepper.font = $Lagoon.headingFont
SegmentedControl.font = $Lagoon.smallFont
SegmentedControl.selectedFont = $Lagoon.smallStrongFont
Scrim.background = $Lagoon.color.scrim
