# FlatLagoonDarkLaf: Lagoon at night, loaded after FlatLaf Dark's and Lagoon's own properties.
# Key reference: https://www.formdev.com/flatlaf/properties-files/
#
# Shapes, shading and sizes are Lagoon's; this file gives them a calm blue-grey night palette. Every colour below
# comes from the variables in the first section, so a palette is that section alone. The text is soft on purpose:
# nothing but the accent stands out, so a long evening of reading tables does not glare.
#
# Every key that FlatLagoonLaf.properties sets to a colour of its own is set again here (a test checks it), so no
# light colour is left behind.

#---- palette ------------------------------------------------------------------------------------------------
# Ground (panels, menu bar, tab strip, table header), sunken content (tables, lists, trees, fields), popup menus.
@background = #2A3038
@componentBackground = #232931
@textComponentBackground = @componentBackground
@menuBackground = #2F3640
# Soft text, and the quieter kinds.
@foreground = #AEB7C1
@disabledForeground = #66717D
@disabledBackground = @background
# Lines: a component's frame; the line round tab content and scroll panes, header separators; the table grid,
# scroll bar and toolbar lines; the etched ring round fields (shadow above and left, highlight below and right).
@lagoonFrame = #5B6774
@lagoonContentLine = #4B5562
@lagoonGrid = #353D48
@lagoonRingShadow = #21262D
@lagoonRingHighlight = #363D47
# Arrows of combo boxes, spinners and scroll bars; hover of bars and tabs; pressed or toggled faces; a raised
# plain face (hovered scroll bar buttons).
@lagoonArrow = #8691A0
@lagoonDisabledArrow = #4E5866
@lagoonHover = #343B45
@lagoonPressed = #20252C
@lagoonRaised = #3A4350
# The raised face of buttons (LagoonSheen): top, middle, foot, and the one-pixel highlight under the frame.
@lagoonSheenTop = #465060
@lagoonSheenMiddle = #3A4350
@lagoonSheenBottom = #313945
@lagoonSheenHighlight = #505B6B
# The accent: selected rows with the focus; focus and hover frames, check marks, progress.
@lagoonAccent = #2569B3
@lagoonFocus = #3A80CC
@selectionBackground = @lagoonAccent
@selectionForeground = #E1E8F0
# A quiet blue: rows without the focus, menus, selected text, tooltips, frame titles; the text on it stays soft.
@lagoonPale = #2C4561
@selectionInactiveBackground = #34465C
@selectionInactiveForeground = @foreground
@menuSelectionBackground = @lagoonPale
@menuAcceleratorSelectionForeground = @foreground
@cellFocusColor = lighten(@selectionBackground,15%)
# FlatLaf's own accent, for what Lagoon leaves to FlatLaf: the same blue.
@accentBaseColor = @lagoonFocus
# Scroll thumbs at rest; hover, pressed, frames and grips are worked out from it.
@lagoonThumb = #3A5570
# Links, tree lines, error and warning frames.
@lagoonLink = #6A9FD8
@lagoonTreeLine = #3F5F80
@lagoonError = #B4524E
@lagoonWarning = #B38A1F

#---- shapes -----------------------------------------------------------------------------------------------
# Sizes and focus as in Lagoon: FlatLaf Dark's thicker focus inside buttons is FlatLaf Light's again.
Button.innerFocusWidth = 0
HelpButton.innerFocusWidth = 0
Component.borderColor = @lagoonFrame
Component.disabledBorderColor = @lagoonContentLine
Component.ringShadowColor = @lagoonRingShadow
Component.ringHighlightColor = @lagoonRingHighlight
Component.focusColor = @lagoonFocus
Component.error.borderColor = @lagoonError
Component.warning.borderColor = @lagoonWarning
Component.linkColor = @lagoonLink

#---- buttons ----------------------------------------------------------------------------------------------
Lagoon.sheen.top = @lagoonSheenTop
Lagoon.sheen.middle = @lagoonSheenMiddle
Lagoon.sheen.bottom = @lagoonSheenBottom
Lagoon.sheen.highlight = @lagoonSheenHighlight
Lagoon.sheen.pressedTop = darken(@lagoonSheenBottom,6%)
Lagoon.sheen.pressedMiddle = darken(@lagoonSheenBottom,3%)
Lagoon.sheen.pressedBottom = @lagoonSheenBottom
Button.foreground = @foreground
Button.borderColor = @lagoonFrame
Button.disabledBorderColor = @lagoonContentLine
Button.disabledText = @disabledForeground
Button.hoverBackground = @lagoonRaised
Button.hoverBorderColor = @lagoonFocus
Button.pressedBackground = @lagoonPressed
Button.focusedBorderColor = @lagoonFocus
Button.focusedBackground = @lagoonRaised
Button.default.foreground = @foreground
Button.default.borderColor = @lagoonFrame
Button.default.hoverBackground = @lagoonRaised
Button.default.focusedBorderColor = @lagoonFocus
Button.default.focusedBackground = @lagoonRaised
ToggleButton.selectedBackground = @lagoonPressed
ToggleButton.focusedBackground = @lagoonRaised
ToggleButton.selectedForeground = @foreground
ToggleButton.toolbar.selectedBackground = @lagoonPressed
Button.toolbar.hoverBackground = @lagoonHover
Button.toolbar.pressedBackground = @lagoonPressed

#---- check / radio ----------------------------------------------------------------------------------------
CheckBox.icon.background = @componentBackground
CheckBox.icon.borderColor = @lagoonFrame
CheckBox.icon.selectedBackground = @componentBackground
CheckBox.icon.selectedBorderColor = @lagoonFrame
CheckBox.icon.checkmarkColor = @lagoonFocus
CheckBox.icon.focusedBorderColor = @lagoonFocus
CheckBox.icon.hoverBorderColor = @lagoonFocus
CheckBox.icon.hoverBackground = @componentBackground
CheckBox.icon.pressedBackground = @lagoonHover
CheckBox.icon.disabledBorderColor = @lagoonGrid
CheckBox.icon.disabledCheckmarkColor = @disabledForeground

#---- text components --------------------------------------------------------------------------------------
TextField.background = @textComponentBackground
TextField.inactiveForeground = @disabledForeground
TextComponent.selectionBackground = @lagoonPale
TextComponent.selectionForeground = @foreground

#---- combo / spinner --------------------------------------------------------------------------------------
ComboBox.editableBackground = @textComponentBackground
ComboBox.buttonSeparatorColor = @lagoonFrame
ComboBox.buttonDisabledSeparatorColor = @lagoonGrid
ComboBox.buttonArrowColor = @lagoonArrow
ComboBox.buttonDisabledArrowColor = @lagoonDisabledArrow
ComboBox.buttonHoverArrowColor = @lagoonFocus
ComboBox.buttonPressedArrowColor = @lagoonFocus
ComboBox.popupBackground = @componentBackground
Spinner.background = @textComponentBackground
Spinner.buttonSeparatorColor = @lagoonFrame
Spinner.buttonArrowColor = @lagoonArrow
Spinner.buttonDisabledArrowColor = @lagoonDisabledArrow
Spinner.buttonHoverArrowColor = @lagoonFocus

#---- tabs -------------------------------------------------------------------------------------------------
TabbedPane.hoverColor = @lagoonHover
TabbedPane.contentAreaColor = @lagoonContentLine
TabbedPane.unselectedBorderColor = @lagoonGrid
TabbedPane.unselectedBottomColor = darken(@background,3%)
TabbedPane.underlineColor = @lagoonContentLine
TabbedPane.inactiveUnderlineColor = @lagoonContentLine

#---- tables / lists / trees -------------------------------------------------------------------------------
Table.background = @componentBackground
Table.foreground = @foreground
Table.gridColor = @lagoonGrid
TableHeader.foreground = @foreground
TableHeader.separatorColor = @lagoonContentLine
TableHeader.bottomSeparatorColor = @lagoonFrame
TableHeader.hoverBackground = @lagoonHover
TableHeader.pressedBackground = @lagoonPressed
TableHeader.sortIconColor = @lagoonArrow
List.background = @componentBackground
Tree.background = @componentBackground
Tree.hash = @lagoonTreeLine
Viewport.background = @componentBackground
ScrollPane.background = @componentBackground

#---- scroll bars / progress -------------------------------------------------------------------------------
ScrollBar.thumb = @lagoonThumb
ScrollBar.hoverThumbColor = lighten(@lagoonThumb,7%)
ScrollBar.pressedThumbColor = lighten(@lagoonThumb,3%)
ScrollBar.thumbBorderColor = darken(@lagoonThumb,9%)
ScrollBar.hoverThumbBorderColor = darken(@lagoonThumb,5%)
ScrollBar.pressedThumbBorderColor = darken(@lagoonThumb,7%)
ScrollBar.gripHighlightColor = lighten(@lagoonThumb,18%)
ScrollBar.gripShadowColor = darken(@lagoonThumb,12%)
ScrollBar.hoverGripShadowColor = darken(@lagoonThumb,10%)
ScrollBar.pressedGripShadowColor = darken(@lagoonThumb,12%)
ScrollBar.buttonArrowColor = @lagoonArrow
ScrollBar.buttonDisabledArrowColor = @lagoonDisabledArrow
ScrollBar.hoverButtonBackground = @lagoonRaised
ScrollBar.pressedButtonBackground = @lagoonPressed
ScrollBar.lineColor = @lagoonGrid
ProgressBar.foreground = @lagoonAccent
ProgressBar.selectionBackground = @foreground
ProgressBar.selectionForeground = @selectionForeground
Slider.trackColor = @lagoonGrid
Slider.thumbColor = lighten(@lagoonThumb,7%)
Slider.trackValueColor = lighten(@lagoonThumb,7%)
Slider.focusedColor = fade(@lagoonFocus,0%)

#---- menus / toolbar / tooltip ----------------------------------------------------------------------------
MenuBar.borderColor = @lagoonRingShadow
MenuBar.hoverBackground = @lagoonHover
MenuBar.selectionBackground = @menuSelectionBackground
MenuBar.selectionForeground = @foreground
MenuBar.selectionBorderColor = @lagoonFocus
Menu.background = @menuBackground
Menu.selectionBackground = @menuSelectionBackground
Menu.selectionForeground = @foreground
MenuItem.background = @menuBackground
MenuItem.selectionBackground = @menuSelectionBackground
MenuItem.selectionForeground = @foreground
CheckBoxMenuItem.selectionBackground = @menuSelectionBackground
RadioButtonMenuItem.selectionBackground = @menuSelectionBackground
PopupMenu.background = @menuBackground
# Check marks and radio dots in menus take the accent, as in the light theme (FlatLaf Dark greys them).
CheckBoxMenuItem.icon.checkmarkColor = @lagoonFocus
CheckBoxMenuItem.icon.disabledCheckmarkColor = @disabledForeground
PopupMenu.borderColor = @lagoonFrame
Separator.foreground = @lagoonRingShadow
Separator.background = @lagoonRingHighlight
ToolBar.separatorColor = @lagoonGrid
ToolBar.gripColor = @lagoonContentLine
ToolTip.background = @lagoonPale
ToolTip.foreground = @foreground
ToolTip.border = 1,3,1,3,@lagoonFrame

#---- panels, frames, split panes --------------------------------------------------------------------------
Label.foreground = @foreground
Label.disabledForeground = @disabledForeground
TitledBorder.titleColor = @foreground
TitledBorder.highlightColor = @lagoonRingHighlight
TitledBorder.shadowColor = @lagoonRingShadow
SplitPaneDivider.gripColor = @lagoonContentLine
SplitPaneDivider.oneTouchArrowColor = @lagoonArrow
InternalFrame.activeTitleBackground = @lagoonPale
InternalFrame.activeTitleForeground = @foreground
InternalFrame.inactiveTitleBackground = @lagoonHover
InternalFrame.inactiveTitleForeground = @foreground
InternalFrame.activeBorderColor = @lagoonFrame
InternalFrame.inactiveBorderColor = @lagoonContentLine
InternalFrame.buttonHoverBackground = @lagoonRaised
InternalFrame.buttonPressedBackground = @lagoonPressed
Desktop.background = darken(@background,4%)
